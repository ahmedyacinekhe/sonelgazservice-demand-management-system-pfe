<app-navbar></app-navbar>

<div class="container mt-4">
  <h4 class="fw-bold mb-4">📝 Nouvelle Requête</h4>

  <div class="card shadow p-4">
    <div class="card-body">

      <!-- Choix du métier -->
      <div class="mb-3">
        <label class="form-label">Métier</label>
        <select class="form-control" [(ngModel)]="selectedIdMetier" (change)="onMetierChange()">
          <option [ngValue]="null" disabled>-- Choisir un métier --</option>
          <option *ngFor="let m of metiers" [value]="m.idMetier">{{ m.libelleMetier }}</option>
        </select>
      </div>

      <!-- Choix du département filtré -->
      <div class="mb-3">
        <label class="form-label">Département</label>
        <select class="form-control" [(ngModel)]="requete.departement" [disabled]="departements.length === 0">
          <option [ngValue]="null" disabled>-- Choisir un département --</option>
          <option *ngFor="let d of departements" [ngValue]="{ idDepartement: d.idDepartement }">
            {{ d.libelleDepartement }}
          </option>
        </select>
        <small class="text-muted" *ngIf="!selectedIdMetier">Veuillez d'abord choisir un métier</small>
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea 
          class="form-control" 
          rows="4" 
          placeholder="Décrivez votre requête..."
          [(ngModel)]="requete.description">
        </textarea>
      </div>

      <!-- Type de requête -->
      <div class="mb-3">
        <label class="form-label">Type de requête</label>
        <select class="form-control" [(ngModel)]="requete.typeRequete">
          <option value="">-- Choisir --</option>
          <option value="ADMINISTRATIVE">Administrative</option>
          <option value="TECHNIQUE">Technique</option>
          <option value="CONGE">Congé</option>
          <option value="MATERIEL">Matériel</option>
        </select>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

      <button class="btn w-100 text-white" style="background-color: #de7b3b;" 
        (click)="submit()" [disabled]="loading || !requete.departement">
        {{ loading ? 'Envoi...' : 'Soumettre la requête' }}
      </button>

    </div>
  </div>
</div>
